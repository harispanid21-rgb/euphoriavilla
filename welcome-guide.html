<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eutopia Villa Guide</title>
<meta name="robots" content="noindex, nofollow">
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f0e8;color:#171513;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding-bottom:76px}button{font:inherit}.serif{font-family:Georgia,"Times New Roman",serif}.screen{display:none}.screen.active{display:block}
.hero{position:relative;height:420px;overflow:hidden;background:#111}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.08),rgba(0,0,0,.48))}
.logo{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:72px 16px 24px;color:white}.logo h1{font-size:52px;letter-spacing:.10em;margin:0;font-weight:400;line-height:.92;text-shadow:0 5px 20px rgba(0,0,0,.35)}.villa{margin-top:12px;font-size:21px;letter-spacing:.35em}.welcome{margin-top:14px;color:#e0b36f;font-size:42px;font-style:italic}.logo p{margin:10px auto 0;max-width:330px;line-height:1.42;font-size:15px;text-shadow:0 3px 14px rgba(0,0,0,.45)}
.menu,.lang{position:absolute;z-index:5;top:18px;background:rgba(251,246,239,.95);border:1px solid rgba(255,255,255,.55);box-shadow:0 10px 28px rgba(0,0,0,.18)}.menu{left:16px;width:68px;height:76px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.menu i{display:block;width:30px;height:2px;background:#171513;margin:3px 0;border-radius:8px}.menu span{font-size:11px;text-transform:uppercase;letter-spacing:.08em}.lang{right:14px;border-radius:999px;padding:11px 14px;display:flex;gap:10px;align-items:center;font-size:15px}.lang b{width:1px;height:20px;background:#bfa98d}
.home-content{position:relative;z-index:3;margin:-34px 10px 24px}.panel{background:rgba(251,246,239,.98);border-radius:28px;padding:13px;box-shadow:0 16px 40px rgba(0,0,0,.12)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fffdfa;border:1px solid #eadfd1;border-radius:20px;min-height:140px;padding:15px 12px;position:relative;box-shadow:0 6px 18px rgba(0,0,0,.045);text-align:left;width:100%;cursor:pointer;color:inherit}.icon{font-size:36px;color:#a8753d;margin-bottom:12px}.card h2{font-family:Georgia,"Times New Roman",serif;text-transform:uppercase;letter-spacing:.055em;font-size:16.5px;line-height:1.14;margin:0;font-weight:500}.card p{font-size:12.5px;line-height:1.35;color:#5b554e;margin:8px 32px 0 0}.arrow{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:#f3ece3;color:#a8753d;display:flex;align-items:center;justify-content:center;font-size:28px}
.topbar{height:64px;background:#fffdfa;border-bottom:1px solid #eadfd1;display:flex;align-items:center;justify-content:center;position:sticky;top:0;z-index:10}.topbar h1{font-family:Georgia,"Times New Roman",serif;text-transform:uppercase;letter-spacing:.06em;font-size:21px;margin:0;text-align:center;max-width:72%;line-height:1.05}.back,.heart{position:absolute;top:0;height:64px;border:0;background:transparent;font-size:32px;color:#171513}.back{left:8px}.heart{right:14px;color:#a8753d}
.page{padding:22px 16px 28px;max-width:760px;margin:auto}.intro{font-size:17px;line-height:1.5;color:#37322e;margin:0 0 22px}.list-card{width:100%;min-height:86px;border:1px solid #eadfd1;background:rgba(255,255,255,.88);border-radius:18px;margin-bottom:12px;padding:16px;display:flex;align-items:center;gap:16px;text-align:left;box-shadow:0 8px 24px rgba(82,57,31,.07);cursor:pointer;color:inherit}.list-icon{font-size:34px;color:#a8753d;width:42px;text-align:center;flex:none}.list-card h2{font-size:17px;margin:0;font-weight:700}.list-card p{font-size:13.5px;margin:5px 0 0;color:#5b554e;line-height:1.35}.list-arrow{margin-left:auto;color:#a8753d;font-size:30px}
.info-card{background:rgba(255,255,255,.88);border:1px solid #eadfd1;border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 8px 24px rgba(82,57,31,.07)}.info-card h3{font-family:Georgia,"Times New Roman",serif;text-transform:uppercase;letter-spacing:.055em;font-size:19px;margin:0 0 10px}.info-card li{font-size:15.5px;line-height:1.55;color:#37322e;margin:4px 0}.info-card ul{margin:0;padding-left:20px}.info-card a{color:#a8753d;font-weight:700;text-decoration:underline}.gold-btn{border:0;width:100%;border-radius:14px;padding:15px;background:linear-gradient(135deg,#c89b50,#a87632);color:white;font-weight:700;font-size:16px;margin-top:16px;cursor:pointer}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,251,245,.97);border-top:1px solid #eadfd1;padding-bottom:env(safe-area-inset-bottom)}.bottom-inner{height:72px;display:grid;grid-template-columns:repeat(4,1fr);max-width:760px;margin:auto}.nav{border:0;background:transparent;color:#555;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;text-align:center;padding:9px 0}.nav.active{color:#a8753d;font-weight:700}@media(min-width:700px){body{max-width:430px;margin:0 auto;box-shadow:0 20px 80px rgba(0,0,0,.18)}}

button,.card,.list-card{touch-action:manipulation;-webkit-tap-highlight-color:rgba(168,117,61,.18)}
a{touch-action:manipulation}
</style></head>

  window.goHome = function(){ currentCategory=null; show('home'); };
  window.openCategory = function(id){
    if(id === 'rules'){ window.openDetail('house-rules','home'); return; }
    var c = categories[id]; currentCategory = id;
    byId('catTitle').textContent = c.title;
    byId('catIntro').textContent = c.intro;
    var html = '';
    for(var i=0;i<c.items.length;i++){
      var it=c.items[i];
      html += '<button type="button" class="list-card" onclick="openDetail(\''+it[0]+'\')"><div class="list-icon">'+it[1]+'</div><div><h2>'+safe(it[2])+'</h2><p>'+safe(it[3])+'</p></div><div class="list-arrow">›</div></button>';
    }
    byId('catList').innerHTML = html;
    show('category');
  };
  window.backToCat = function(){ currentCategory ? window.openCategory(currentCategory) : window.goHome(); };
  window.openDetail = function(id, from){
    if(from === 'home'){ currentCategory = null; }
    var d = details[id];
    byId('detTitle').textContent = d.title;
    byId('detIntro').textContent = d.intro;
    var html = '';
    for(var i=0;i<d.blocks.length;i++){
      var b=d.blocks[i];
      html += '<article class="info-card"><h3>'+safe(b[0])+'</h3><ul>';
      for(var j=0;j<b[1].length;j++){ html += '<li>'+linkItem(b[1][j])+'</li>'; }
      html += '</ul></article>';
    }
    byId('detBlocks').innerHTML = html;
    show('detail');
  };
