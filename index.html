<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eutopia Villa | Coming Soon</title>
  <meta name="description" content="Eutopia Villa is preparing a new online experience.">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://eutopiavilla.gr/">
  <meta property="og:title" content="Eutopia Villa | Coming Soon">
  <meta property="og:description" content="Our new website is under construction.">
  <meta property="og:image" content="https://eutopiavilla.gr/images/hero/main.jpg">
  <style>
    :root {
      --ink: #171513;
      --paper: #fbf6ef;
      --gold: #a68966;
      --navy: #000080;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .backdrop {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(251, 246, 239, .94), rgba(251, 246, 239, .72)),
        url("images/hero/main.jpg") center / cover;
    }

    .content {
      position: relative;
      width: min(100%, 720px);
      padding: clamp(32px, 7vw, 72px);
      border: 1px solid rgba(166, 137, 102, .28);
      background: rgba(255, 253, 250, .9);
      box-shadow: 0 28px 80px rgba(23, 21, 19, .14);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--gold);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .32em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(44px, 9vw, 86px);
      font-weight: 400;
      line-height: .95;
    }

    .subhead {
      margin: 24px auto 0;
      max-width: 520px;
      color: #4c4741;
      font-size: clamp(17px, 2vw, 21px);
      line-height: 1.55;
    }

    .divider {
      width: 72px;
      height: 1px;
      margin: 32px auto;
      background: var(--gold);
    }

    .note {
      margin: 0;
      color: #766b60;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    @media (max-width: 560px) {
      main {
        padding: 14px;
      }

      .content {
        padding: 32px 22px;
      }

      .eyebrow,
      .note {
        letter-spacing: .2em;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="backdrop" aria-hidden="true"></div>
    <section class="content" aria-labelledby="page-title">
      <p class="eyebrow">Website Under Construction</p>
      <h1 id="page-title">Eutopia Villa</h1>
      <p class="subhead">We are preparing a refreshed online experience for our villa in Lagonisi.</p>
      <div class="divider" aria-hidden="true"></div>
      <p class="note">Coming Soon</p>
    </section>
  </main>
</body>
</html>
